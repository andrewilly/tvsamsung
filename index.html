<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070a">
<title>DTV Stream</title>
<link rel="stylesheet" href="assets/styles.css?v=2">
</head>
<body>

<main class="screen is-active" id="screen-home">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">DTV</span>
      <span class="brand-text">
        <strong>Stream</strong>
        <em>Canali via internet &middot; ordine digitale terrestre</em>
      </span>
    </div>
    <div class="topbar-right">
      <span class="chip" id="status-chip"><i class="dot"></i><span id="status-text">in linea</span></span>
      <span class="clock" id="clock">--:--</span>
    </div>
  </header>

  <div class="grid-wrap">
    <div class="grid" id="grid"></div>
  </div>

  <footer class="hints">
    <span><b>&#9664;&#9650;&#9660;&#9654;</b> muovi</span>
    <span><b>OK</b> guarda</span>
    <span><b>0-9</b> numero canale</span>
  </footer>
</main>

<section class="screen" id="screen-player">
  <video id="video" playsinline webkit-playsinline preload="none"></video>

  <div class="osd" id="osd">
    <div class="osd-lcn" id="osd-lcn">1</div>
    <div class="osd-meta">
      <div class="osd-name" id="osd-name">Canale</div>
      <div class="osd-sub"><i class="live-dot"></i><span id="osd-sub">in diretta</span></div>
    </div>
  </div>

  <div class="player-state" id="player-state">
    <div class="state-card" id="state-card">
      <div class="spinner" id="spinner"></div>
      <div class="state-title" id="state-title">Connessione al canale&hellip;</div>
      <div class="state-text" id="state-text"></div>
      <div class="state-actions" id="state-actions"></div>
      <div class="state-extra" id="state-extra"></div>
    </div>
  </div>

  <footer class="player-hints" id="player-hints">
    <span><b>RETURN</b> torna ai canali</span>
    <span><b>&#9664;&#9654;</b> canale precedente / successivo</span>
  </footer>
</section>

<div class="numpad" id="numpad" aria-hidden="true"><span id="numpad-value"></span></div>

<script src="data/channels.js?v=2"></script>
<script src="assets/app.js?v=2"></script>
</body>
</html>
